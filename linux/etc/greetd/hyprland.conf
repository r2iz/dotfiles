# Minimal compositor session used only to display ReGreet.
monitor = ,preferred,auto,1

input {
    kb_layout = jp
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
}

# Avoid portal startup delays in the greeter session.
env = GTK_USE_PORTAL,0
env = GDK_DEBUG,no-portals

# ReGreet exits after a successful login; then close this compositor session.
exec-once = /usr/bin/regreet --config /etc/greetd/regreet.toml --style /etc/greetd/regreet.css; hyprctl dispatch exit
